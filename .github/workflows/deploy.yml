name: Deploy Angular site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "aBBi LV/abbi-ng-ai-image-descriptor/package-lock.json"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: "aBBi LV/abbi-ng-ai-image-descriptor"
        run: npm ci

      - name: Build Angular application
        working-directory: "aBBi LV/abbi-ng-ai-image-descriptor"
        run: npm run build -- --base-href=/aiRA/

      - name: Prepare Pages artifact
        run: |
          APP_DIR="aBBi LV/abbi-ng-ai-image-descriptor"

          INDEX_FILE=$(find "$APP_DIR/dist" -type f -name index.html | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "No index.html found inside $APP_DIR/dist"
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX_FILE")

          echo "Publishing from: $SITE_DIR"

          mkdir -p pages-dist
          cp -a "$SITE_DIR"/. pages-dist/
          touch pages-dist/.nojekyll

          echo "Files prepared for deployment:"
          find pages-dist -maxdepth 2 -type f | head -50

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
